# After a post reaches main, date it with that day and tell IndexNow.
# This is the one workflow that commits to main, and only to set those dates.
name: Publish dates and IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the date script
        run: python3 scripts/stamp_publish_dates.py --self-test

      - name: Set the publish date on new posts
        id: stamp
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/stamp_publish_dates.py --before "$BEFORE" --after "$AFTER"

      - name: Commit the publish dates
        if: steps.stamp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- blog.html sitemap.xml
          git add -- *.html
          if [[ "$(git branch --show-current)" != "main" ]]; then
            echo "Refusing to commit publish dates anywhere but main." >&2
            exit 1
          fi
          git commit -m "Set the publish date on posts merged to main"
          git push origin HEAD:main

      - name: Tell IndexNow about changed posts
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/indexnow_ping.py --before "$BEFORE" --after "$AFTER"
