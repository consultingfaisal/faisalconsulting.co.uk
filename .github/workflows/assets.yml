# Pages load style.min.css and site.min.js. This check fails if those files
# are out of date with style.css and site.js, or a page still loads an
# unminified file. Fix with: python3 scripts/minify_assets.py
name: Check minified assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check minified assets
        run: python3 scripts/minify_assets.py --check
