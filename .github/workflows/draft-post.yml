# Gemini fallback drafter. Run by hand only. Opens a pull request. Never pushes to main.
# Since 12 Nov 2026 the daily post is written by Claude's scheduled task (see docs/content-automation.md).
name: Draft blog post

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: draft-blog-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    # Gemini retries wait about 34 minutes, then the job still has to push a branch.
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the script
        run: python3 scripts/draft_post.py --self-test

      - name: See if a draft is already open
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/draft_gate.sh

      - name: Prepare the next queued post
        id: prepare
        if: steps.gate.outputs.waiting != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/draft_post.py --apply

      - name: Open a pull request
        if: steps.prepare.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ steps.prepare.outputs.topic }}
          SLUG: ${{ steps.prepare.outputs.slug }}
          FILENAME: ${{ steps.prepare.outputs.filename }}
          DATE: ${{ steps.prepare.outputs.date }}
          QUERY: ${{ steps.prepare.outputs.query }}
          WRITER: ${{ steps.prepare.outputs.writer }}
          BODYFILE: ${{ steps.prepare.outputs.bodyfile }}
        run: bash scripts/open_draft_pr.sh

      # Same-day alert. Any failed step opens one issue that mentions Faisal,
      # so GitHub emails him. Later failures add a comment to the same issue.
      - name: Tell Faisal the draft failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/draft_failure_alert.sh fail

      - name: Close the failure alert
        if: success() && steps.prepare.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/draft_failure_alert.sh ok
